name: Workspace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Docs and workspace hygiene
        run: |
          python -B scripts/check-docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-workspace.ps1
      - name: Whitespace in event diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          $base, $head = $env:PUSH_BASE, $env:PUSH_HEAD
          if ($env:EVENT -eq 'pull_request') {
            $base = git merge-base $env:PR_BASE $env:PR_HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $head = $env:PR_HEAD
          }
          if ($base -match '^0+$') {
            $base = cmd.exe /d /c 'git hash-object -w -t tree --stdin < NUL'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not $base -or -not $head) { throw 'Event diff range missing.' }
          git diff --check $base $head --
          exit $LASTEXITCODE
      - name: Tooling syntax
        run: |
          $failures = @()
          Get-ChildItem scripts,tests/tooling -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens, $errors = $null, $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            $failures += $errors
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
          python -B -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8-sig'),filename=str(p)) for folder in ['tools/thesis','tests/tooling'] for p in pathlib.Path(folder).glob('*.py')]; ast.parse(pathlib.Path('scripts/check-docs.py').read_text(encoding='utf-8'))"
          exit $LASTEXITCODE
      - name: Docs checker self-tests
        run: python -B -m unittest discover -s tests/tooling -p test_docs_check.py
      - name: Runner self-tests
        run: ./scripts/test/run-tests.ps1 -Suite tooling
      - name: Retain tooling reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-tooling
          path: |
            .artifacts/test-runs/*-tooling-*/summary.json
            .artifacts/test-runs/*-tooling-*/reports/*.xml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
