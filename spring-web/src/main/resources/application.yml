server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${PARKING_SESSION_COOKIE_SECURE:true}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    # Existing databases must opt in to versioned migrations after review and backup.
    enabled: ${PARKING_FLYWAY_ENABLED:false}

parking:
  anpr:
    base-url: ${ANPR_BASE_URL:http://localhost:8001}
    service-token: ${ANPR_SERVICE_TOKEN:}
  gate-evidence:
    directory: ${PARKING_GATE_EVIDENCE_DIR:var/private-gate-evidence}
    retention-days: ${PARKING_GATE_EVIDENCE_RETENTION_DAYS:30}
    cleanup-cron: ${PARKING_GATE_EVIDENCE_CLEANUP_CRON:0 0 2 * * *}
    cleanup-zone: ${PARKING_GATE_EVIDENCE_CLEANUP_ZONE:UTC}
  security:
    jwt:
      # Without external RS256 keys the Desktop bearer chain remains unavailable.
      enabled: ${PARKING_JWT_ENABLED:false}
      issuer: ${PARKING_JWT_ISSUER:}
      audience: ${PARKING_JWT_AUDIENCE:}
      kid: ${PARKING_JWT_KID:}
      public-key-pem: ${PARKING_JWT_PUBLIC_KEY_PEM:}
      private-key-pem: ${PARKING_JWT_PRIVATE_KEY_PEM:}
      # JSON array of {kid, publicKeyPem, notBefore?, verifyUntil?}. The active kid has no window;
      # retiring keys require verifyUntil and are accepted only while the signed token fits that window.
      verification-keys-json: ${PARKING_JWT_VERIFICATION_KEYS_JSON:}
