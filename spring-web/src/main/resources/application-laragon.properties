spring.datasource.url=jdbc:mysql://${PARKING_DB_HOST:127.0.0.1}:${PARKING_DB_PORT:3306}/${PARKING_DB_NAME:parking_anpr}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${PARKING_DB_USER:root}
spring.datasource.password=${PARKING_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
