# Profile du phong MySQL Laragon local. Launcher run-web-laragon.ps1 van truyen
# cac bien PARKING_DB_* de co the override ma khong ghi credential vao repository.
spring.datasource.url=${PARKING_DB_URL:jdbc:mysql://127.0.0.1:3306/parking_anpr?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${PARKING_DB_USERNAME:root}
spring.datasource.password=${PARKING_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
