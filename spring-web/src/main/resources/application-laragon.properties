# Tên profile được giữ để tương thích. Hệ thống vẫn dùng Aiven là database chính.
spring.datasource.url=${PARKING_DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${PARKING_DB_USERNAME}
spring.datasource.password=${PARKING_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
