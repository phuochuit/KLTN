spring.application.name=parking-web
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/parking-demo;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Upload ảnh hồ sơ: giới hạn đủ cho ảnh camera/điện thoại nhưng vẫn tránh request quá lớn.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-http-form-post-size=25MB
