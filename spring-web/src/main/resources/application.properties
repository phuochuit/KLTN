spring.application.name=parking-web
server.port=8080

# MySQL Aiven chính. Credential phải đến từ biến môi trường hoặc .env.local.
spring.datasource.url=${PARKING_DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${PARKING_DB_USERNAME}
spring.datasource.password=${PARKING_DB_PASSWORD}

# Cấu hình Hibernate cho MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Aiven tự đóng kết nối rảnh (~15 phút) và máy trạm có thể sleep, nên phải
# tái tạo connection trước khi máy chủ cắt. Nếu không, request đầu tiên sau khi
# idle sẽ lỗi "Communications link failure" cho tới khi khởi động lại web.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.validation-timeout=5000

# Cấu hình Thymeleaf & Jackson
spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Upload ảnh hồ sơ: giới hạn đủ cho ảnh camera/điện thoại nhưng vẫn tránh request quá lớn.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-http-form-post-size=25MB

# API trạm gác bắt buộc JWT theo mặc định. Chỉ profile test/demo cô lập mới được tắt rõ ràng.
parking.security.jwt.enabled=${PARKING_SECURITY_JWT_ENABLED:true}
parking.security.jwt.issuer=${PARKING_SECURITY_JWT_ISSUER:https://parking.local}
parking.security.jwt.audience=${PARKING_SECURITY_JWT_AUDIENCE:parking-desktop}
parking.security.jwt.kid=${PARKING_SECURITY_JWT_KID:key-2026-10}
parking.security.jwt.private-key-location=${PARKING_SECURITY_JWT_PRIVATE_KEY_LOCATION:}
parking.security.jwt.public-key-location=${PARKING_SECURITY_JWT_PUBLIC_KEY_LOCATION:}

# FastAPI chỉ nhận yêu cầu nội bộ do Spring ký bằng service token.
parking.ai.base-url=${PARKING_AI_BASE_URL:http://127.0.0.1:8001}
parking.ai.service-token=${PARKING_INTERNAL_SERVICE_TOKEN:}
parking.ai.connect-timeout=${PARKING_AI_CONNECT_TIMEOUT:5s}
parking.ai.read-timeout=${PARKING_AI_READ_TIMEOUT:5m}

# Gate Evidence và lưu trữ sinh trắc học private.
parking.private-storage-path=${PARKING_PRIVATE_STORAGE_PATH:private-data}
# Chỉ dùng để đọc ảnh legacy trong thời gian migration; không còn được publish qua HTTP.
parking.upload-dir=${PARKING_UPLOAD_DIR:uploads}
parking.evidence.required=${PARKING_EVIDENCE_REQUIRED:true}
parking.evidence.retention-days=${PARKING_EVIDENCE_RETENTION_DAYS:30}
parking.evidence.cleanup-enabled=${PARKING_EVIDENCE_CLEANUP_ENABLED:false}
parking.evidence.cleanup-cron=${PARKING_EVIDENCE_CLEANUP_CRON:0 0 3 * * *}
