<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập quản trị bãi xe</title>
    <style>
        :root { --navy:#17365d; --blue:#2e74b5; --border:#dce4ee; --text:#172033; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Segoe UI,Arial,sans-serif; color:var(--text); background:linear-gradient(145deg,#edf4fb,#f8fafc 55%,#e9f1f8); }
        .login-card { width:min(100%,430px); overflow:hidden; background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:0 22px 55px rgba(23,54,93,.16); }
        .brand { padding:28px 32px 24px; color:#fff; background:linear-gradient(135deg,var(--navy),var(--blue)); }
        .brand-mark { display:inline-grid; place-items:center; width:46px; height:46px; margin-bottom:14px; border-radius:12px; background:rgba(255,255,255,.16); font-size:24px; }
        h1 { margin:0 0 7px; font-size:25px; }
        .brand p { margin:0; color:#dcecff; line-height:1.5; }
        .content { padding:28px 32px 32px; }
        .message { margin:0 0 18px; padding:12px 14px; border-radius:9px; line-height:1.45; }
        .message-error { color:#8a1c13; background:#fff1f0; border:1px solid #efb2ad; }
        .message-success { color:#176b45; background:#e9f7ef; border:1px solid #a8ddc2; }
        label { display:block; margin:0 0 7px; color:var(--navy); font-weight:700; }
        .field { margin-bottom:18px; }
        input { width:100%; min-height:46px; padding:11px 12px; border:1px solid #aebdce; border-radius:8px; font:inherit; }
        input:focus { outline:3px solid rgba(46,116,181,.2); border-color:var(--blue); }
        .password-wrap { position:relative; }
        .password-wrap input { padding-right:72px; }
        .toggle { position:absolute; right:8px; top:7px; min-height:32px; padding:5px 8px; color:var(--blue); background:transparent; border:0; font-weight:700; cursor:pointer; }
        .submit { width:100%; min-height:48px; border:0; border-radius:9px; color:#fff; background:var(--blue); font:inherit; font-weight:750; cursor:pointer; }
        .submit:hover { background:#235c91; }
        .help { margin:18px 0 0; color:#64748b; font-size:13px; line-height:1.5; text-align:center; }
        @media(max-width:480px) { .brand,.content { padding-left:22px; padding-right:22px; } }
    </style>
</head>
<body>
<main class="login-card">
    <section class="brand">
        <div class="brand-mark" aria-hidden="true">P</div>
        <h1>Parking ANPR</h1>
        <p>Đăng nhập hệ thống quản lý bãi đỗ xe</p>
    </section>
    <section class="content">
        <p class="message message-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <p class="message message-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
        <form method="post" th:action="@{/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="username">Tên đăng nhập</label>
                <input id="username" name="username" type="text" maxlength="80" autocomplete="username" autofocus required>
            </div>
            <div class="field">
                <label for="password">Mật khẩu</label>
                <div class="password-wrap">
                    <input id="password" name="password" type="password" maxlength="1024" autocomplete="current-password" required>
                    <button id="togglePassword" class="toggle" type="button" aria-pressed="false">Hiện</button>
                </div>
            </div>
            <button class="submit" type="submit">Đăng nhập</button>
        </form>
    </section>
</main>
<script>
    const password = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');
    toggle.addEventListener('click', function () {
        const visible = password.type === 'text';
        password.type = visible ? 'password' : 'text';
        toggle.textContent = visible ? 'Hiện' : 'Ẩn';
        toggle.setAttribute('aria-pressed', String(!visible));
    });
</script>
</body>
</html>
