<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="navigation" class="navigation-content">
  <a class="dashboard-brand" th:href="@{/}"><img th:src="@{/images/brand/lumipark-icon.svg}" alt=""><span>LumiPark<small>SMART PARKING</small></span></a>
  <nav class="dashboard-navigation" aria-label="Điều hướng chính">
    <p class="nav-section">KHÔNG GIAN LÀM VIỆC</p>
    <a class="nav-item" th:classappend="${activePage == null or activePage == 'overview' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == null or activePage == 'overview' ? 'page' : null}" th:href="@{/}"><img th:src="@{/images/lucide/layout-dashboard.svg}" alt="">Tổng quan</a>
    <p class="nav-section" th:if="${#sets.contains(currentAuthorities,'RESIDENT_MANAGE') or #sets.contains(currentAuthorities,'VEHICLE_MANAGE') or #sets.contains(currentAuthorities,'CARD_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}">HỒ SƠ</p>
    <a class="nav-item" th:classappend="${activePage == 'registrations' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'registrations' ? 'page' : null}" th:href="@{/registrations}" th:if="${#sets.contains(currentAuthorities,'VEHICLE_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}"><img th:src="@{/images/lucide/clipboard-list.svg}" alt="">Đăng ký hồ sơ</a>
    <a class="nav-item" th:classappend="${activePage == 'households' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'households' ? 'page' : null}" th:href="@{/households}" th:if="${#sets.contains(currentAuthorities,'RESIDENT_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}"><img th:src="@{/images/lucide/house.svg}" alt="">Hộ gia đình</a>
    <a class="nav-item" th:classappend="${activePage == 'vehicles' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'vehicles' ? 'page' : null}" th:href="@{/vehicles}" th:if="${#sets.contains(currentAuthorities,'VEHICLE_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}"><img th:src="@{/images/lucide/car-front.svg}" alt="">Phương tiện</a>
    <a class="nav-item" th:classappend="${activePage == 'cards' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'cards' ? 'page' : null}" th:href="@{/cards}" th:if="${#sets.contains(currentAuthorities,'CARD_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}"><img th:src="@{/images/lucide/credit-card.svg}" alt="">Thẻ &amp; gói</a>
    <p class="nav-section" th:if="${#sets.contains(currentAuthorities,'SLOT_MANAGE') or #sets.contains(currentAuthorities,'HISTORY_VIEW') or #sets.contains(currentAuthorities,'PAYMENT_RECONCILE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}">VẬN HÀNH</p>
    <a class="nav-item" th:classappend="${activePage == 'slots' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'slots' ? 'page' : null}" th:href="@{/slots}" th:if="${#sets.contains(currentAuthorities,'SLOT_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}"><img th:src="@{/images/lucide/map.svg}" alt="">Sơ đồ bãi</a>
    <a class="nav-item" th:classappend="${activePage == 'sessions' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'sessions' ? 'page' : null}" th:href="@{/sessions}" th:if="${#sets.contains(currentAuthorities,'HISTORY_VIEW') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}"><img th:src="@{/images/lucide/history.svg}" alt="">Lịch sử xe</a>
    <a class="nav-item" th:classappend="${activePage == 'payments' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'payments' ? 'page' : null}" th:href="@{/payments}" th:if="${#sets.contains(currentAuthorities,'PAYMENT_RECONCILE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}"><img th:src="@{/images/lucide/receipt.svg}" alt="">Giao dịch &amp; đối soát</a>
    <details class="nav-extra" th:open="${activePage == 'pricing' or activePage == 'settings' or activePage == 'audit' or activePage == 'roles' or activePage == 'accounts'}" th:if="${#sets.contains(currentAuthorities,'PRICING_MANAGE') or #sets.contains(currentAuthorities,'SLOT_MANAGE') or #sets.contains(currentAuthorities,'ACCOUNT_MANAGE') or #sets.contains(currentAuthorities,'SHIFT_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGE') or #sets.contains(currentAuthorities,'SECURITY_AUDIT_VIEW') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}"><summary>Cấu hình &amp; quản trị</summary><div>
      <a class="nav-item" th:classappend="${activePage == 'pricing' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'pricing' ? 'page' : null}" th:href="@{/pricing}" th:if="${#sets.contains(currentAuthorities,'PRICING_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}">Bảng giá</a>
      <a class="nav-item" th:classappend="${activePage == 'settings' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'settings' ? 'page' : null}" th:href="@{/settings}" th:if="${#sets.contains(currentAuthorities,'SLOT_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}">Hạn mức</a>
      <a class="nav-item" th:classappend="${activePage == 'accounts' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'accounts' ? 'page' : null}" th:href="@{/account-management}" th:if="${#sets.contains(currentAuthorities,'ACCOUNT_MANAGE') or #sets.contains(currentAuthorities,'SHIFT_MANAGE') or #sets.contains(currentAuthorities,'SECURITY_AUDIT_VIEW') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}">Tài khoản</a>
      <a class="nav-item" th:classappend="${activePage == 'roles' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'roles' ? 'page' : null}" th:href="@{/roles}" th:if="${#sets.contains(currentAuthorities,'ROLE_MANAGE') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}">Vai trò &amp; quyền hạn</a>
      <a class="nav-item" th:classappend="${activePage == 'audit' ? 'is-selected' : ''}" th:attr="aria-current=${activePage == 'audit' ? 'page' : null}" th:href="@{/security-audit}" th:if="${#sets.contains(currentAuthorities,'SECURITY_AUDIT_VIEW') or #sets.contains(currentAuthorities,'ROLE_MANAGEMENT')}">Nhật ký bảo mật</a>
    </div></details>
  </nav>
  <div class="navigation-bottom"><a class="nav-item" th:href="@{/account/password}"><img th:src="@{/images/lucide/user-round.svg}" alt="">Đổi mật khẩu</a><form th:action="@{/logout}" method="post" class="dashboard-logout" th:attr="data-confirm=${activePage == 'accounts' ? 'Bạn muốn đăng xuất khỏi hệ thống?' : null},data-confirm-title=${activePage == 'accounts' ? 'Đăng xuất' : null}"><button class="nav-item" type="submit"><img th:src="@{/images/lucide/log-out.svg}" alt="">Đăng xuất</button></form><p>LumiPark · Smart Parking Operations</p></div>
</div>
</body></html>
