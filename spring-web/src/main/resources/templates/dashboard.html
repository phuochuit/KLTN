<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dashboard</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header th:replace="~{fragments :: header}"></header><main><h1>Dashboard vận hành</h1>
<div class="grid grid-five"><div class="card"><span class="muted">Hộ gia đình</span><div class="metric" th:text="${householdCount}">0</div></div><div class="card"><span class="muted">Xe đăng ký</span><div class="metric" th:text="${vehicleCount}">0</div></div><div class="card"><span class="muted">Xe đang trong bãi</span><div class="metric" th:text="${openCount}">0</div></div><div class="card"><span class="muted">Doanh thu hôm nay</span><div class="metric"><span th:text="${#numbers.formatDecimal(todayRevenue,0,'COMMA',0,'POINT')}">0</span> đ</div></div><div class="card"><span class="muted">Doanh thu tháng</span><div class="metric"><span th:text="${#numbers.formatDecimal(monthRevenue,0,'COMMA',0,'POINT')}">0</span> đ</div></div></div>
<div class="card"><h2>Lượt xe gần đây</h2><table><thead><tr><th>ID</th><th>Biển số</th><th>Vào</th><th>Ra</th><th>Trạng thái</th><th>Phí lượt</th></tr></thead><tbody><tr th:each="s:${recentSessions}"><td th:text="${s.id}"></td><td th:text="${s.entryPlate}"></td><td th:text="${#temporals.format(s.entryTime,'dd/MM/yyyy HH:mm')}"></td><td th:text="${s.exitTime == null ? '-' : #temporals.format(s.exitTime,'dd/MM/yyyy HH:mm')}"></td><td th:text="${s.status.displayName}" th:class="${s.status.name() == 'OPEN' ? 'status-open' : 'status-completed'}"></td><td th:text="${#numbers.formatDecimal(s.fee,0,'COMMA',0,'POINT') + ' đ'}"></td></tr><tr th:if="${#lists.isEmpty(recentSessions)}"><td colspan="6" class="muted">Chưa có lượt xe.</td></tr></tbody></table></div>
</main></body></html>
