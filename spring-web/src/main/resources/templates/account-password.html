<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #17212b; background: #f3f6f8; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
        main { width: min(100%, 440px); padding: 32px; border: 1px solid #d7e0e7; border-radius: 12px; background: #fff; box-shadow: 0 12px 32px #17212b14; }
        h1 { margin: 0 0 8px; font-size: 1.5rem; }
        p { line-height: 1.5; color: #52606d; }
        label { display: block; margin: 18px 0 6px; font-weight: 600; }
        input[type=password], input[type=text] { width: 100%; min-height: 44px; padding: 9px 11px; border: 1px solid #9aa9b5; border-radius: 6px; box-sizing: border-box; font: inherit; }
        input:focus-visible, button:focus-visible { outline: 3px solid #1769aa; outline-offset: 2px; }
        button { width: 100%; min-height: 44px; margin-top: 24px; padding: 9px 16px; border: 0; border-radius: 6px; background: #145d8c; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
        .error { padding: 10px 12px; border-left: 4px solid #a52727; background: #fff1f0; color: #7f1d1d; }
        .toggle { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
        .toggle input { width: 20px; height: 20px; }
    </style>
</head>
<body>
<main>
    <h1>Đổi mật khẩu</h1>
    <p>Bạn phải đặt mật khẩu mới trước khi tiếp tục sử dụng trang quản trị.</p>
    <p>Mật khẩu phải dài từ 12 đến 72 byte UTF-8.</p>
    <p class="error" role="alert" aria-live="polite" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/account/password}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="currentPassword">Mật khẩu hiện tại</label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        <label for="newPassword">Mật khẩu mới</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" required>
        <label for="confirmPassword">Xác nhận mật khẩu mới</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
        <label class="toggle"><input id="showPasswords" type="checkbox"> Hiện mật khẩu</label>
        <button type="submit">Cập nhật mật khẩu</button>
    </form>
</main>
<script>
    document.getElementById('showPasswords').addEventListener('change', function () {
        const type = this.checked ? 'text' : 'password';
        document.querySelectorAll('input[autocomplete$="password"]').forEach(input => input.type = type);
    });
</script>
</body>
</html>
