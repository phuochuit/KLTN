<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Lịch sử</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments :: header}"></header><main><h1>Lịch sử xe vào/ra</h1>
<table><thead><tr><th>ID</th><th>Biển số vào</th><th>Biển số ra</th><th>Loại xe AI</th><th>Thẻ</th><th>Thời gian vào</th><th>Thời gian ra</th><th>Trạng thái</th><th>Phí</th></tr></thead><tbody><tr th:each="s:${sessions}"><td th:text="${s.id}"></td><td th:text="${s.entryPlate}"></td><td th:text="${s.exitPlate ?: '-'}"></td><td th:text="${s.detectedVehicleType.displayName}"></td><td th:text="${s.parkingCard?.cardCode ?: '-'}"></td><td th:text="${#temporals.format(s.entryTime,'dd/MM/yyyy HH:mm')}"></td><td th:text="${s.exitTime == null ? '-' : #temporals.format(s.exitTime,'dd/MM/yyyy HH:mm')}"></td><td th:text="${s.status.displayName}" th:class="${s.status.name() == 'OPEN' ? 'status-open' : 'status-completed'}"></td><td th:text="${#numbers.formatDecimal(s.fee,0,'COMMA',0,'POINT') + ' đ'}"></td></tr></tbody></table></main></body></html>
